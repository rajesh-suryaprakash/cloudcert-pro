name: Cloudcert Pro CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Principle of least privilege — read-only token by default.
# Jobs that need additional permissions declare them explicitly.
permissions:
  contents: read

# Cancel in-progress runs for the same branch to avoid wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Code Quality ────────────────────────────────────────────────────
  # Lint, type-check, and format validation — fast feedback, runs independently.
  quality:
    name: Quality (lint · typecheck · format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to full SHA — immutable, safe against tag-moving supply-chain attacks.
        # actions/checkout v6.0.2
        uses: actions/checkout@v7

      - name: Setup Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Security audit (critical severity)
        # Fail CI only on critical CVEs. High-severity findings in devDependencies
        # (brace-expansion DoS via ESLint) and react-router CSRF (RSC mode only,
        # not used by this app) require breaking dependency downgrades; track those
        # separately via 'npm audit --audit-level=high' during dependency maintenance.
        run: npm audit --audit-level=critical

  # ── Job 2: Tests + Coverage ────────────────────────────────────────────────
  # Vitest suite with coverage enforcement (≥80% threshold configured in vitest.config.ts).
  # Runs in parallel with the quality job for faster feedback.
  # Produces: JUnit XML, JSON, HTML test reports + LCOV/HTML coverage reports.
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    # dorny/test-reporter needs write access to post check annotations on PRs.
    # pull-requests:write allows it to post the results summary as a PR comment.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage + reports
        # Single test run that generates everything:
        #   • test-results/junit.xml   — JUnit for dorny/test-reporter annotations
        #   • test-results/results.json — machine-readable JSON results
        #   • test-results/index.html  — interactive HTML report artifact
        #   • coverage/lcov.info       — LCOV for Codecov upload
        #   • coverage/index.html      — browseable HTML coverage report
        # The CI reporters are enabled automatically because GitHub Actions sets
        # the CI=true environment variable, which is checked in vitest.config.ts.
        run: mkdir -p test-results && npm run test:coverage

      - name: Publish test results
        # dorny/test-reporter v3.0.0 — Node 24 runtime (v3 replaces v1.x which used Node 20)
        # Runs even if the test step failed so failures are always annotated.
        if: always()
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3.0.0
        with:
          name: Vitest Results
          path: test-results/junit.xml
          reporter: java-junit
          # Don't double-fail the job — the test step already sets the exit code.
          fail-on-error: 'false'

      - name: Upload test result artifacts
        # Uploads JUnit XML, JSON results, and interactive HTML report.
        # Always uploaded so failure reports are accessible even on a failing run.
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      - name: Upload coverage to Codecov
        # codecov/codecov-action v5.4.3 — uploads LCOV to Codecov for trend tracking.
        # fail_ci_if_error: false so a Codecov outage doesn't break the pipeline.
        # Set the CODECOV_TOKEN repository secret in Settings → Secrets → Actions.
        if: always()
        uses: codecov/codecov-action@4650159d642e33fdc30954ca22638caf0df6cac8
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: cloudcert-pro-${{ github.sha }}
          fail_ci_if_error: false
          verbose: false

      - name: Upload coverage report artifact
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          # 30-day retention on the default branch (rollback reference); 7 days for PRs.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  # ── Job 3: Build ───────────────────────────────────────────────────────────
  # Vite frontend build — only runs after quality + tests pass.
  # "Build once, deploy many": this artifact is what gets promoted to staging/prod.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  # ── Job 4: Security (npm audit — SCA layer 1) ─────────────────────────────
  # Dependency vulnerability audit — runs in parallel with quality + test.
  # Fails the pipeline on high/critical CVEs.
  security:
    name: Security audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Audit summary
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then
            echo "::error::Critical vulnerabilities found. Run 'npm audit' locally and address them before merging."
            exit 1
          else
            echo "No critical vulnerabilities found."
          fi

  # ── Job 5: Secret Scanning ─────────────────────────────────────────────────
  # TruffleHog scans the full git history for accidentally committed secrets.
  secret-scan:
    name: Secret scanning (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for PR scans)
        uses: actions/checkout@v7 # v6.0.2
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        # trufflesecurity/trufflehog v3.94.3 — pinned to immutable SHA
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  # ── Job 6: SAST — CodeQL ──────────────────────────────────────────────────
  # Static Application Security Testing using GitHub's CodeQL engine.
  # Analyses TypeScript/JavaScript source for security vulnerabilities:
  # SQL injection, XSS, path traversal, insecure crypto, prototype pollution,
  # command injection, open redirect, and 50+ other CWE patterns.
  #
  # Runs the 'security-extended' query suite which covers OWASP Top 10 and
  # CWE Top 25 — broader than the default suite, still fast for this codebase.
  #
  # Results are uploaded to the GitHub Security tab as SARIF and also surface
  # as PR annotations so developers see findings inline in the diff.
  #
  # Requires: Settings → Code security → Code scanning → enabled (free for public
  # repos; requires GitHub Advanced Security for private repos).
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF results to the GitHub Security tab
      security-events: write
      # Required for CodeQL to read Actions metadata
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Initialise CodeQL
        # github/codeql-action v4 — Node 24 runtime (v4 replaces v3 which used Node 20)
        # Pinned to immutable SHA for supply-chain safety
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          # security-extended covers OWASP Top 10 + CWE Top 25.
          # Use 'security-and-quality' to also catch maintainability issues.
          queries: security-extended

      - name: Autobuild
        # CodeQL autobuild compiles the project so the analyser can trace data flows.
        # For TypeScript/JavaScript this is a no-op (interpreted), but it ensures
        # any build-time code generation is captured.
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: codeql-javascript
          # Upload results to GitHub Security tab and surface as PR annotations
          upload: always
          output: codeql-results.sarif

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7 # v4.6.2
        with:
          name: codeql-results-${{ github.sha }}
          path: codeql-results.sarif
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  # ── Job 7: SCA — OWASP Dependency-Check ──────────────────────────────────
  # Software Composition Analysis using OWASP Dependency-Check.
  # Complements npm audit with a second, independent CVE database (NVD) and
  # cross-references CPE identifiers — catches vulnerabilities that npm audit
  # misses because they are not yet in the npm advisory database.
  #
  # Scans: node_modules/ against NVD, OSS Index, and RetireJS databases.
  # Fails the pipeline on CVSS score ≥ 7 (HIGH) findings.
  # Uploads an HTML + SARIF report to the GitHub Security tab.
  #
  # Note: The NVD API key (NVD_API_KEY secret) is optional but strongly
  # recommended — without it the NVD feed is rate-limited to 5 req/30s,
  # which can slow this job to 10+ minutes on first run.
  # Obtain a free key at: https://nvd.nist.gov/developers/request-an-api-key
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure output directory exists
        run: mkdir -p dependency-check-report

      - name: Run OWASP Dependency-Check
        # dependency-check/Dependency-Check_Action v1.1.0 — pinned to immutable SHA
        # NOTE: As of v1.1.0 the action's valid top-level inputs are:
        #   entryPoint, args, project, path, format, others
        # Advanced options (failOnCVSS, suppressionFiles, enableRetired, nvdApiKey,
        # out directory) must be passed via the 'args' input as CLI flags.
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600
        id: depcheck
        continue-on-error: true
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: cloudcert-pro
          path: '.'
          format: 'ALL'
          # All advanced CLI options go into 'args' — the action's own inputs
          # only expose: entryPoint, args, project, path, format, others.
          args: >-
            --out dependency-check-report
            --failOnCVSS 7
            --suppression .dependency-check-suppressions.xml
            --enableRetired
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload Dependency-Check HTML report
        if: always()
        uses: actions/upload-artifact@v7 # v4.6.2
        with:
          name: dependency-check-report-${{ github.sha }}
          path: dependency-check-report/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
          # Don't fail if no files were produced (scan may have errored early)
          if-no-files-found: warn

      - name: Upload Dependency-Check SARIF to GitHub Security tab
        # Only upload if the SARIF file was actually produced
        if: always() && hashFiles('dependency-check-report/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: dependency-check-report/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Fail pipeline if high/critical CVEs found
        if: steps.depcheck.outcome == 'failure'
        run: |
          echo "::error::OWASP Dependency-Check found HIGH or CRITICAL CVEs (CVSS ≥ 7)."
          echo "::error::Review the HTML report artifact and remediate before merging."
          exit 1

  # ── Job 8: DAST — OWASP ZAP Baseline Scan ────────────────────────────────
  # Dynamic Application Security Testing using OWASP ZAP.
  # Starts the Express server inside the runner, then runs ZAP's baseline scan
  # against http://localhost:3000 to detect runtime vulnerabilities:
  # - Missing security headers (CSP, HSTS, X-Frame-Options, etc.)
  # - Exposed sensitive information in responses
  # - Insecure cookie attributes (missing HttpOnly, Secure, SameSite)
  # - Clickjacking vulnerabilities
  # - Cross-domain misconfiguration
  # - Server information disclosure
  #
  # The baseline scan is passive (no active attack payloads) — safe to run
  # against any environment. It spiders the app and checks responses.
  #
  # Runs AFTER the build job so the production dist/ is available for serving.
  # Uses minimal env vars — no real secrets needed; ZAP only checks HTTP responses.
  #
  # Results are uploaded as a SARIF report to the GitHub Security tab and as
  # an HTML artifact for human review.
  dast:
    name: DAST (OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        # Reuse the dist/ built in Job 3 — avoids a second Vite build
        uses: actions/download-artifact@v8 # v4.3.0
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Fix workspace permissions for ZAP Docker container
        # ZAP runs as UID 1000 inside Docker. Without this the container cannot
        # write the SARIF/HTML report to the workspace directory, causing exit code 3.
        run: sudo chown -R 1000:1000 ${{ github.workspace }}

      - name: Start Express server (background)
        # Start the server with dummy secrets — ZAP only inspects HTTP responses,
        # it does not need valid JWT secrets or a real database.
        # NODE_ENV=production serves the pre-built dist/ as static files.
        run: |
          NODE_ENV=production \
          JWT_SECRET="zap-ci-dummy-secret-min-32-characters-ok" \
          RESET_TOKEN_SECRET="zap-ci-dummy-reset-secret-min-32-chars" \
          SEED_ADMIN_EMAIL="admin@example.com" \
          SEED_ADMIN_PASSWORD="ZapCiPassword1!" \
          SEED_LEARNER_EMAIL="learner@example.com" \
          SEED_LEARNER_PASSWORD="ZapCiPassword1!" \
          PORT=3000 \
          node_modules/.bin/tsx server.ts &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to be ready
        # Poll /api/health (or /) until the server responds, max 30 seconds.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not start within 30 seconds"
          exit 1

      - name: Run ZAP Baseline Scan
        # zaproxy/action-baseline v0.15.0 — pinned to immutable SHA
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874
        continue-on-error: true
        id: zap
        with:
          target: 'http://localhost:3000'
          # ZAP rules configuration — suppress known false positives
          # Create .zap/rules.tsv to tune alert thresholds per rule ID
          rules_file_name: '.zap/rules.tsv'
          # Upload SARIF to GitHub Security tab
          issue_title: 'ZAP Baseline Scan Report'
          fail_action: warn
          allow_issue_writing: false
          artifact_name: zap-baseline-report-${{ github.sha }}

      - name: Upload ZAP SARIF to GitHub Security tab
        # Guard against missing SARIF — ZAP may not produce it if exit code 3 (Docker error).
        # The hashFiles() guard prevents the upload step from failing when no file exists.
        if: always() && hashFiles(format('zap-baseline-report-{0}.sarif', github.sha)) != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: zap-baseline-report-${{ github.sha }}.sarif
          category: zap-dast
        continue-on-error: true

      - name: Stop Express server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Fail pipeline on ZAP HIGH findings
        # ZAP risk levels: 0=Informational, 1=Low, 2=Medium, 3=High
        # Use `conclusion` (not `outcome`) because continue-on-error makes outcome
        # always 'success'; conclusion reflects the real underlying exit status.
        # Change to 'failure' to hard-fail on HIGH findings once alerts are remediated.
        if: steps.zap.conclusion == 'failure'
        run: |
          echo "::warning::ZAP Baseline Scan found HIGH risk findings."
          echo "::warning::Review the ZAP HTML report artifact and create .zap/rules.tsv to suppress known false positives."
          echo "::warning::Once all HIGH findings are remediated, change this step to exit 1."

  # ── Job 9: Dead Code Analysis ─────────────────────────────────────────────
  # Detects unused files, exports, types, and npm dependencies using knip and
  # depcheck. Runs in parallel with quality and test for fast feedback.
  #
  # knip: Statically traces all entry points (src/main.tsx, server.ts, etc.)
  #   and reports any file, export, or type that is never reached. Configured
  #   via knip.json at the repository root. Fails the job (exit 1) on findings.
  #
  # depcheck: Reports npm packages declared in package.json that are not
  #   imported anywhere in source. Runs with continue-on-error so it surfaces
  #   findings as warnings without blocking the pipeline on day 1.
  #
  # Both tools upload JSON reports as downloadable artifacts so developers
  # can triage findings without digging through raw logs.
  dead-code:
    name: Dead Code Analysis (knip · depcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run knip (unused files · exports · types)
        # knip traces all entry points defined in knip.json and reports anything
        # that is never reached. --reporter json writes machine-readable output
        # that is uploaded as an artifact below.
        # Exit code 1 = findings present → job (and PR check) fails.
        id: knip
        run: |
          mkdir -p dead-code-reports
          npx knip --reporter json 2>&1 | tee dead-code-reports/knip-report.json || true
          npx knip --reporter compact
        continue-on-error: false

      - name: Run depcheck (unused npm packages)
        # depcheck scans source files and reports packages declared in
        # package.json that are never imported. Runs as informational only
        # (continue-on-error: true) so transitive or tooling-only packages
        # don't break the pipeline — review the artifact and triage manually.
        id: depcheck
        continue-on-error: true
        run: |
          mkdir -p dead-code-reports
          npx depcheck --json 2>&1 | tee dead-code-reports/depcheck-report.json || true
          echo "--- depcheck summary ---"
          npx depcheck

      - name: Annotate depcheck findings
        # Surface depcheck findings as a workflow warning so they appear in
        # the Actions summary even though the step doesn't fail the job.
        if: steps.depcheck.outcome == 'failure'
        run: |
          echo "::warning::depcheck found unused npm packages. Review dead-code-reports/depcheck-report.json artifact and consider removing them."

      - name: Upload dead code reports
        # Always upload reports — even when knip finds nothing — so the artifact
        # is consistently present for auditing and trend comparison across runs.
        if: always()
        uses: actions/upload-artifact@v7 # v4.6.2
        with:
          name: dead-code-reports-${{ github.sha }}
          path: dead-code-reports/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
