<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default title — overridden dynamically per-route by useDocumentTitle -->
    <title>CloudCert Pro</title>
    <!-- Favicon — SVG scales perfectly at all sizes; PNG fallback for older browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <!-- Apple touch icon for iOS home screen bookmarks -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Theme color for mobile browser chrome (matches indigo-600) -->
    <meta name="theme-color" content="#4f46e5" />
    <!-- SEO / social sharing -->
    <meta
      name="description"
      content="CloudCert Pro — GCP cloud certification exam preparation with adaptive quizzes, spaced repetition, and detailed progress insights."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
