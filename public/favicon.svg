<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square matching the app's indigo-600 brand color -->
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>

  <!-- Brain/circuit icon — simplified version of the BrainCircuit motif used in the header -->
  <!-- Left brain lobe -->
  <path d="M9 13.5 C9 11 11 9 13.5 9 C14.5 9 15.5 9.4 16 10 C16.5 9.4 17.5 9 18.5 9 C21 9 23 11 23 13.5 C23 15 22.3 16.3 21.2 17.1 L21.2 22 C21.2 22.6 20.7 23 20.2 23 L11.8 23 C11.3 23 10.8 22.6 10.8 22 L10.8 17.1 C9.7 16.3 9 15 9 13.5 Z" fill="white" opacity="0.95"/>

  <!-- Circuit nodes on the brain -->
  <circle cx="13" cy="14" r="1.2" fill="#4f46e5"/>
  <circle cx="16" cy="12.5" r="1.2" fill="#4f46e5"/>
  <circle cx="19" cy="14" r="1.2" fill="#4f46e5"/>
  <circle cx="16" cy="17" r="1.2" fill="#4f46e5"/>

  <!-- Circuit traces connecting nodes -->
  <line x1="13" y1="14" x2="16" y2="12.5" stroke="#4f46e5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="16" y1="12.5" x2="19" y2="14" stroke="#4f46e5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="13" y1="14" x2="16" y2="17" stroke="#4f46e5" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19" y1="14" x2="16" y2="17" stroke="#4f46e5" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Bottom connector lines (circuit legs) -->
  <line x1="13.5" y1="23" x2="13.5" y2="26" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="18.5" y1="23" x2="18.5" y2="26" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="16" y1="23" x2="16" y2="26" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>
